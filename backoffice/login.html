<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicia sesión en el backoffice de componentes de computadora.">
  <title>Iniciar sesión · Kali Components</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth">
  <main class="card">
    <div class="brand">
      <span>Kali Components</span>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="card__subtitle">Administra el inventario de componentes de computadora.</p>

    <p id="aviso" class="alert" role="alert" hidden>
      Debes iniciar sesión para acceder al panel.
    </p>

    <form id="login-form" class="form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com"
               autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña"
               autocomplete="current-password" minlength="8" required>
      </div>

      <button id="login-submit" type="submit" class="btn btn--block">Entrar</button>
    </form>

    <p class="card__footer">
      ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </p>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
