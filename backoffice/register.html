<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea una cuenta en el backoffice de componentes de computadora.">
  <title>Crear cuenta · Kali Components</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth">
  <main class="card">
    <div class="brand">
      <span>Kali Components</span>
    </div>

    <h1>Crear cuenta</h1>
    <p class="card__subtitle">Regístrate para gestionar componentes de computadora.</p>

    <form class="form" action="home.html" method="get">
      <div class="field">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre"
               autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com"
               autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
               autocomplete="new-password" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repite la contraseña"
               autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn--block">Registrarme</button>
    </form>

    <p class="card__footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </main>
</body>
</html>
